[package]
name = "codex-github-bridge"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bridge"
path = "src/bin/bridge.rs"

[[bin]]
name = "bridge-acp-relay"
path = "src/bin/bridge-acp-relay.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
